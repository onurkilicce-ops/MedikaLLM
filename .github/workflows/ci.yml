name: CI

# Runs on every PR, on pushes to main, and on demand. Work branches
# (feat/, fix/, chore/, docs/) are tested through their pull requests.
# No deployment, no health monitor, no paid provider, no API key and no
# DrugBank data are involved.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs on the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (locked deps + synthetic PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # Throw-away database that exists only for this job. Its name ends in
      # _synth and is confirmed via MEDICALLM_SYNTHETIC_PG_CONFIRM below;
      # tests/integration/synthetic_data.py refuses anything else.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: synth
          POSTGRES_PASSWORD: synth
          POSTGRES_DB: medicallm_ci_synth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synth -d medicallm_ci_synth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Public tokenizer data (tiktoken o200k_base) used by the token-budget
      # tests. Prepared explicitly below; never downloaded silently mid-test.
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
      # The embedding model is never needed by the test suite.
      HF_HUB_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Check the lockfile is up to date
        working-directory: backend
        run: uv lock --check

      - name: Install locked backend dependencies (incl. dev group)
        working-directory: backend
        run: uv sync --locked --python 3.12

      - name: Verify the real packages import (no stubs)
        working-directory: backend
        run: |
          uv run --no-sync python -c "
          import importlib, sys
          mods = ['openai', 'langchain', 'langchain_core', 'langchain_openai', 'langgraph',
                  'pgvector.sqlalchemy', 'tiktoken', 'psycopg2', 'fastapi', 'sqlalchemy']
          for m in mods:
              mod = importlib.import_module(m)
              print(m, getattr(mod, '__version__', ''))
          print(sys.version)
          "

      - name: Cache tokenizer data
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/tiktoken
          key: tiktoken-o200k_base-${{ hashFiles('backend/uv.lock') }}

      - name: Prepare tokenizer data (fails the job if unavailable)
        working-directory: backend
        run: uv run --no-sync python -c "import tiktoken; tiktoken.get_encoding('o200k_base'); print('o200k_base ready')"

      - name: Run pytest (strict - any skip fails)
        working-directory: backend
        env:
          # Strict mode: required packages must import, every skip is a
          # failure, and every tests/**/test_*.py module must collect tests.
          MEDICALLM_STRICT_TESTS: "1"
          MEDICALLM_SYNTHETIC_PG_URL: postgresql://synth:synth@127.0.0.1:5432/medicallm_ci_synth
          MEDICALLM_SYNTHETIC_PG_CONFIRM: medicallm_ci_synth
          # Placeholders only. The app database URL points at a closed port so
          # nothing outside the synthetic DB can be reached; the LLM URL is
          # unroutable and no key is set.
          JWT_SECRET: ci-test-secret-not-for-production
          ADMIN_PASSWORD: ci-test-admin
          DO_POSTGRES_URL: postgresql://unused:unused@127.0.0.1:1/unused_app_db
          DB_SSLMODE: disable
          LLM_BASE_URL: http://127.0.0.1:9/v1
          DO_MODEL_ACCESS_KEY: ""
        run: uv run --no-sync pytest tests -p no:cacheprovider -q --tb=short -ra

      # M-02 UI -> real HTTP -> auth/service -> this job's throw-away PG.
      # No browser, real DrugBank data or LLM credentials are required.
      - name: Set up Node for M02 integrated DOM flow
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend for the integrated flow
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: M02 React DOM to PostgreSQL flow
        working-directory: backend
        env:
          DO_POSTGRES_URL: postgresql://synth:synth@127.0.0.1:5432/medicallm_ci_synth
          M02_DEMO_CONFIRM: medicallm_ci_synth
          MEDICALLM_SYNTHETIC_PG_CONFIRM: medicallm_ci_synth
          JWT_SECRET: ci-m02-synthetic-not-for-production
          ADMIN_PASSWORD: ci-test-admin
          DB_SSLMODE: disable
          LLM_BASE_URL: http://127.0.0.1:9/v1
          DO_MODEL_ACCESS_KEY: ""
          AUTH_LIMIT: 1000/minute
          SEARCH_LIMIT: 1000/minute
        run: |
          uv run --no-sync python scripts/m02_synthetic_demo.py --seed --serve > /tmp/m02-demo.log 2>&1 &
          m02_pid=$!
          trap 'kill "$m02_pid" 2>/dev/null || true' EXIT
          uv run --no-sync python -c "
          import time, urllib.request, urllib.error
          for i in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:18102/openapi.json', timeout=1)
                  break
              except (urllib.error.URLError, TimeoutError):
                  time.sleep(0.5)
          else:
              raise SystemExit('M02 synthetic server did not start')
          " || { cat /tmp/m02-demo.log; exit 1; }
          cd ../frontend
          npx vitest run --config vite.m02.config.js

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run vitest
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_USE_HTTPS: "true"
        # We also build in CI so a typo that compiles but breaks the prod
        # bundle (e.g. an unresolved import) shows up before merge.
        run: npm run build
